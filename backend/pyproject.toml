[project]
name = "botwok"
version = "0.1.0"
description = "Botwok — local-first AI social media automation operating system (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "procrastinate>=3.0",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "cryptography>=43",
  "aioboto3>=13.1",
  "anthropic>=0.40",
  "openai>=1.50",
  "tiktoken>=0.7",
  "trafilatura>=1.12",
  "feedparser>=6.0",
  "selectolax>=0.3",
  "pypdf>=4.3",
  "jinja2>=3.1",
  "orjson>=3.10",
  "email-validator>=2.2",
  "pillow>=10.4",
  "uuid6>=2024.7",
  "python-dateutil>=2.9",
  "simhash>=2.1",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "basic"
